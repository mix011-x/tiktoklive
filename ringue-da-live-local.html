<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ringue da Live 2</title>
<style>
:root{--bg:#f3f1fb;--pn:#ffffff;--tx:#1b1733;--bd:#d8d2f0;--ac:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1a;--pn:#1b1733;--tx:#f2f0ff;--bd:#352f5c}}
:root[data-theme="dark"]{--bg:#0d0b1a;--pn:#1b1733;--tx:#f2f0ff;--bd:#352f5c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{flex:1;min-height:0;width:100%;display:block}
#panel{background:var(--pn);border-top:1px solid var(--bd);padding:8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
input[type=text]{flex:1;min-width:0}
button{cursor:pointer}
button:active{background:var(--ac);color:#fff}
#st{flex:1;font-size:12px;opacity:.7}
#show{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;opacity:.6}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="row"><input type="text" id="live" placeholder="@usuario ou link da live" aria-label="Usuário ou link da live"><button id="go">Conectar</button></div>
  <div class="row"><input type="text" id="key" placeholder="Chave da Euler Stream (cole aqui)" aria-label="Chave da API"></div>
  <div class="row"><input type="text" id="u" value="Viewer1" maxlength="16" aria-label="Nome do espectador"><span id="st">Modo teste</span><button id="hd">Ocultar</button></div>
  <div class="row" id="gifts"></div>
  <div class="row"><input type="text" id="m" placeholder="Comentário do chat" aria-label="Comentário"><button id="sm">Enviar</button></div>
  <div class="row"><button data-c="força">💪 FORÇA</button><button data-c="cura">💚 CURA</button><button id="snd">🔊 Som</button><label><input type="checkbox" id="bots"> Bots</label></div>
</div>
<button id="show" class="hide" aria-label="Mostrar painel">⚙️</button>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.floor(Math.random()*a.length)];
const cv=$("#c"),ctx=cv.getContext("2d");
let W=0,H=0,RG={t:0,b:1,bw:1,fw:1};
const ring=()=>({t:H*.30,b:H*.86,bw:W*.60,fw:W*.94});
function rs(){const d=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);RG=ring()}
new ResizeObserver(rs).observe(cv);

const GL=[["Rosa","🌹",1],["Coração","❤️",5],["Rosquinha","🍩",30],["Leão","🦁",500],["Universo","🌌",1000]];
const EM={rose:"🌹",heart:"❤️",doughnut:"🍩",donut:"🍩",lion:"🦁",universe:"🌌"};
GL.forEach(g=>EM[g[0].toLowerCase()]=g[1]);
const F=[],Q=[],FX=[],FEED=[],SC={};
let peak=1,banner=null;const MAX=18;
const tier=d=>d>=500?3:d>=30?2:d>=5?1:0;
const log=t=>{FEED.unshift({t,a:0});if(FEED.length>5)FEED.pop()};
const pts=(n,p)=>SC[n]=(SC[n]||0)+p;
const alive=()=>F.filter(f=>!f.dead);
const sz=f=>f.s*(.75+.6*Math.min(1,Math.max(0,(f.y-RG.t)/(RG.b-RG.t))));

const SP=[{n:"Dino",c:"#4caf50",b:"#c8e6a0",k:1.15},{n:"Urso",c:"#8d5a35",b:"#d9b38c",k:1.12},{n:"Gato",c:"#ff9a3c",b:"#ffe3c2",k:.95},{n:"Coelho",c:"#f3f0f5",b:"#ffd6e5",k:.95},{n:"Panda",c:"#f5f5f5",b:"#ffffff",k:1.1},{n:"Cão",c:"#c98f55",b:"#f2d9b8",k:1},{n:"Robô",c:"#8fa3b8",b:"#d5dee8",k:1.05},{n:"Sapo",c:"#7ccf3a",b:"#e6f7b0",k:.95},{n:"Tigre",c:"#ff8a1f",b:"#fff0d6",k:1.1},{n:"Pinguim",c:"#2b3445",b:"#ffffff",k:.9}];
function spawn(n,e,d){
  const T=tier(d),hp=[120,180,280,480][T],k=Math.floor(R(0,10)),sp=SP[k];
  F.push({name:n,emoji:e,tier:T,sp:k,hp,max:hp,lives:[3,3,4,5][T],maxL:[3,3,4,5][T],dmg:[6,9,13,20][T],s:[.8,.95,1.1,1.35][T]*sp.k,x:R(W*.3,W*.7),y:R(RG.t+30,RG.b-20),z:300,vz:0,cd:1,atk:0,hit:0,rage:0,healCd:0,dead:0,ko:0,bub:null,t:R(0,9),glove:Math.random()<.5?"#e53935":"#1e88e5",dir:1,walk:0});
  log(e+" "+n+" entrou como "+sp.n+"!");
}
function onGift(u,g,d,c){
  const e=EM[String(g).toLowerCase()]||"🎁",mine=alive().filter(f=>f.name===u);
  if(mine.length){
    mine.forEach(f=>{f.hp=f.max;f.lives=f.maxL;f.ko=0;FX.push({x:f.x,y:f.y-90*sz(f),txt:"💖 VIDA RESTAURADA!",c:"#ff7ab8",t:1.4})});
    log("💖 "+u+" restaurou a vida do lutador");return;
  }
  if(Q.some(q=>q[0]===u))return;
  alive().length>=MAX?Q.push([u,e,d]):spawn(u,e,d);
}
function onComment(u,text){
  const t=String(text).trim();if(!t)return;
  log("💬 "+u.slice(0,10)+": "+t.slice(0,22));
  const mine=alive().filter(f=>f.name===u),l=t.toLowerCase();
  mine.forEach(f=>{
    f.bub={text:t.slice(0,24),t:3};
    if(/for[çc]a/.test(l)&&f.rage<=0){f.rage=6;FX.push({x:f.x,y:f.y-80*sz(f),txt:"💪 FORÇA!",c:"#ff6b6b",t:1.2})}
    else if(/cura/.test(l)&&f.healCd<=0){f.hp=Math.min(f.max,f.hp+f.max*.25);f.healCd=15;FX.push({x:f.x,y:f.y-80*sz(f),txt:"💚 +HP",c:"#4cd964",t:1.2})}
  });
}
window.onGift=onGift;window.onComment=onComment;

let AC=null,lastSnd=0,mute=false;
const unlock=()=>{try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(_){}};
addEventListener("pointerdown",unlock);addEventListener("keydown",unlock);
function punchSnd(big){
  if(mute||!AC||AC.state!=="running")return;
  const t=AC.currentTime;if(t-lastSnd<.05)return;lastSnd=t;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";o.frequency.setValueAtTime(big?170:130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(big?.5:.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.15);
  const n=Math.floor(AC.sampleRate*.06),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const sr=AC.createBufferSource(),g2=AC.createGain();sr.buffer=buf;g2.gain.value=big?.35:.2;sr.connect(g2);g2.connect(AC.destination);sr.start(t);
}
function strike(a,b){
  a.cd=R(.55,.9)/(a.rage>0?1.6:1);a.atk=.22;
  const crit=Math.random()<.12;
  let dmg=Math.round(a.dmg*R(.8,1.25)*(a.rage>0?2:1));if(crit)dmg=Math.round(dmg*1.8);
  b.hp-=dmg;b.hit=.15;punchSnd(crit||a.tier>=2);
  const l=Math.hypot(b.x-a.x,b.y-a.y)||1;b.x+=(b.x-a.x)/l*10;b.y+=(b.y-a.y)/l*6;
  FX.push({x:b.x,y:b.y-70*sz(b),txt:(crit?"💥":"")+dmg,c:crit?"#ffd23f":"#fff",t:.8});
  if(b.hp<=0){
    pts(a.name,1);
    if(b.lives>1){b.lives--;b.hp=b.max;b.ko=1.5;FX.push({x:b.x,y:b.y-90*sz(b),txt:"💫 NOCAUTE!",c:"#ffd23f",t:1.3});log("💫 "+a.name+" derrubou "+b.name+" ("+b.lives+" vidas)")}
    else{b.hp=0;b.dead=.001;log("🥊 "+a.name+" eliminou "+b.name)}
  }
}
function update(dt){
  const al=alive();peak=Math.max(peak,al.length);
  for(const f of F){
    if(f.dead){f.dead+=dt;continue}
    f.t+=dt;f.cd-=dt;f.atk=Math.max(0,f.atk-dt);f.hit=Math.max(0,f.hit-dt);f.rage=Math.max(0,f.rage-dt);f.healCd=Math.max(0,f.healCd-dt);
    if(f.bub){f.bub.t-=dt;if(f.bub.t<=0)f.bub=null}
    if(f.ko>0){f.ko-=dt;continue}
    if(f.z>0){f.vz+=900*dt;f.z-=f.vz*dt;if(f.z<=0){f.z=0;f.vz=0}continue}
    let tg=null,bd=1e9;
    for(const o of al){if(o===f||o.dead||o.ko>0)continue;const d=Math.hypot(o.x-f.x,(o.y-f.y)*1.8);if(d<bd){bd=d;tg=o}}
    const s=sz(f),reach=38*s,sp=(55+(f.rage>0?35:0))*(.8+.2*f.s);
    f.walk=0;
    if(tg){
      const dx=tg.x-f.x,dy=tg.y-f.y;f.dir=dx>=0?1:-1;
      if(bd>reach*.9){const l=Math.hypot(dx,dy)||1;f.x+=dx/l*sp*dt;f.y+=dy/l*sp*dt;f.walk=1}
      if(bd<=reach&&f.cd<=0&&tg.z<=0)strike(f,tg);
    }
  }
  for(const a of al)for(const b of al){
    if(a===b||a.dead||b.dead||a.z>0||b.z>0)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy*1.8),m=16*sz(a);
    if(d<m&&d>.01){a.x-=dx/d*30*dt;a.y-=dy/d*18*dt}
  }
  for(const f of F){
    f.y=Math.min(RG.b-8,Math.max(RG.t+20,f.y));
    const v=(f.y-RG.t)/(RG.b-RG.t),h=(RG.bw+(RG.fw-RG.bw)*v)/2-16;
    f.x=Math.min(W/2+h,Math.max(W/2-h,f.x));
  }
  const a2=alive();
  if(a2.length===1&&peak>=2){const w=a2[0];pts(w.name,3);banner={t:"🏆 "+w.name+" venceu!",a:0};log("🏆 "+w.name+" venceu o round");w.hp=w.max;w.lives=Math.max(w.lives,3);peak=1}
  if(a2.length===0)peak=1;
  if(banner){banner.a+=dt;if(banner.a>3.5)banner=null}
  if(Q.length&&a2.length<MAX){const q=Q.shift();spawn(q[0],q[1],q[2])}
  for(let i=F.length;i--;)if(F[i].dead>1.2)F.splice(i,1);
  FX.forEach(x=>{x.t-=dt;x.y-=32*dt});
  for(let i=FX.length;i--;)if(FX[i].t<=0)FX.splice(i,1);
  FEED.forEach(f=>f.a+=dt);
}

function ropes(front){
  const r=RG,BL=[W/2-r.bw/2,r.t],BR=[W/2+r.bw/2,r.t],FL=[W/2-r.fw/2,r.b],FR=[W/2+r.fw/2,r.b],hb=H*.1,hf=H*.17,cols=["#ff4d6d","#f5f5f5","#4dabff"];
  ctx.lineCap="round";ctx.lineWidth=4;
  for(let k=1;k<=3;k++){
    const a=k/3.4;ctx.strokeStyle=cols[k-1];ctx.beginPath();
    if(!front){ctx.moveTo(FL[0],FL[1]-hf*a);ctx.lineTo(BL[0],BL[1]-hb*a);ctx.lineTo(BR[0],BR[1]-hb*a);ctx.lineTo(FR[0],FR[1]-hf*a)}
    else{ctx.moveTo(FL[0],FL[1]-hf*a);ctx.lineTo(FR[0],FR[1]-hf*a)}
    ctx.stroke();
  }
  (front?[[FL,hf,"#e53935"],[FR,hf,"#1e88e5"]]:[[BL,hb,"#1e88e5"],[BR,hb,"#e53935"]]).forEach(([p,h,c])=>{
    ctx.strokeStyle="#b9b3d6";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0],p[1]-h);ctx.stroke();
    ctx.fillStyle=c;ctx.fillRect(p[0]-6,p[1]-h*.9,12,h*.62);
    ctx.fillStyle="#ffd23f";ctx.fillRect(p[0]-7,p[1]-h-2,14,4);
  });
}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
const CR=[];for(let i=0;i<90;i++)CR.push({u:Math.random(),r:i%3,h:R(0,360),p:R(0,6)});CR.sort((a,b)=>a.r-b.r);
function glove(f,x,y,s){ctx.fillStyle=f.glove;ctx.beginPath();ctx.arc(x,y,7*s,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(x-2*s,y-2*s,2.5*s,0,7);ctx.fill()}
function body(f){
  const s=sz(f),X=f.x,Y=f.y-f.z,sp=SP[f.sp],d=f.dir,k=f.sp,col=f.hit>0?"#fff":sp.c,bel=f.hit>0?"#fff":sp.b,lim=k===4&&!f.hit?"#222":col;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(f.x,f.y,17*s,5*s,0,0,7);ctx.fill();
  if(f.dead)ctx.globalAlpha=Math.max(0,1-f.dead/1.2);
  const Yd=f.dead?Y-f.dead*30:Y;
  if(f.ko>0){ctx.translate(X,Yd);ctx.rotate(1.35*d);ctx.translate(-X,-Yd)}
  ctx.lineCap="round";
  const sw=f.walk?Math.sin(f.t*12)*7*s:0,Z=Yd-(f.walk?Math.abs(Math.sin(f.t*12))*2*s:0);
  if(k===0||k===2||k===5||k===8){ctx.strokeStyle=col;ctx.lineWidth=(k?4:7)*s;ctx.beginPath();ctx.moveTo(X-d*8*s,Z-18*s);ctx.quadraticCurveTo(X-d*24*s,Z-18*s,X-d*(22+Math.sin(f.t*6)*3)*s,Z-34*s);ctx.stroke()}
  ctx.strokeStyle=lim;ctx.lineWidth=6*s;
  line(X-5*s,Z-12*s,X-6*s+sw,Z);line(X+5*s,Z-12*s,X+6*s-sw,Z);
  const rx=X-d*9*s,ry=Z-22*s+Math.sin(f.t*6)*2*s;
  ctx.lineWidth=5*s;line(X,Z-30*s,rx,ry);glove(f,rx,ry,s);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(X,Z-24*s,11*s,13*s,0,0,7);ctx.fill();
  ctx.fillStyle=bel;ctx.beginPath();ctx.ellipse(X+d*2*s,Z-22*s,7*s,9*s,0,0,7);ctx.fill();
  if(k===0){ctx.fillStyle="#2e7d32";for(let i=0;i<3;i++){const y=Z-36*s+i*8*s;ctx.beginPath();ctx.moveTo(X-d*10*s,y);ctx.lineTo(X-d*17*s,y+4*s);ctx.lineTo(X-d*10*s,y+8*s);ctx.fill()}}
  const hx=X+d*s,hy=Z-48*s,r=14*s,ex0=hx+d*2*s;
  if(k===1||k===4||k===8){ctx.fillStyle=k===4?"#222":col;[-1,1].forEach(m=>{ctx.beginPath();ctx.arc(hx+m*10*s,hy-10*s,5*s,0,7);ctx.fill()})}
  if(k===2){ctx.fillStyle=col;[-1,1].forEach(m=>{ctx.beginPath();ctx.moveTo(hx+m*3*s,hy-12*s);ctx.lineTo(hx+m*12*s,hy-12*s);ctx.lineTo(hx+m*9*s,hy-24*s);ctx.fill()})}
  if(k===3)[-1,1].forEach(m=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(hx+m*6*s,hy-22*s,4*s,11*s,m*.15,0,7);ctx.fill();ctx.fillStyle=bel;ctx.beginPath();ctx.ellipse(hx+m*6*s,hy-22*s,2*s,8*s,m*.15,0,7);ctx.fill()});
  if(k===5){ctx.fillStyle="#6b4423";[-1,1].forEach(m=>{ctx.beginPath();ctx.ellipse(hx+m*13*s,hy+s,4*s,9*s,m*.2,0,7);ctx.fill()})}
  if(k===7){ctx.fillStyle=col;[-1,1].forEach(m=>{ctx.beginPath();ctx.arc(hx+m*8*s,hy-12*s,6*s,0,7);ctx.fill()})}
  if(k===6){ctx.strokeStyle="#9aa";ctx.lineWidth=2*s;line(hx,hy-12*s,hx,hy-22*s);ctx.fillStyle="#f44";ctx.beginPath();ctx.arc(hx,hy-23*s,3*s,0,7);ctx.fill()}
  ctx.fillStyle=col;ctx.beginPath();
  if(k===6)ctx.roundRect(hx-r,hy-r,2*r,2*r,4*s);else ctx.arc(hx,hy,r,0,7);
  ctx.fill();
  if(k===4){ctx.fillStyle="#222";[-1,1].forEach(m=>{ctx.beginPath();ctx.ellipse(ex0+m*5*s,hy-2*s,4.5*s,5.5*s,0,0,7);ctx.fill()})}
  if(k===9){ctx.fillStyle=bel;ctx.beginPath();ctx.ellipse(ex0,hy+3*s,10*s,10*s,0,0,7);ctx.fill()}
  if(k===0){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(hx+d*10*s,hy+4*s,9*s,6*s,0,0,7);ctx.fill()}
  if(k===2||k===3||k===8){ctx.fillStyle=bel;ctx.beginPath();ctx.ellipse(hx+d*4*s,hy+5*s,6*s,4*s,0,0,7);ctx.fill()}
  if(k===8){ctx.strokeStyle="#5a2d00";ctx.lineWidth=2*s;[-5,0,5].forEach(o=>line(hx+o*s,hy-14*s,hx+o*s,hy-8*s))}
  if(k===6){ctx.fillStyle="#4df";[-1,1].forEach(m=>ctx.fillRect(ex0+m*5*s-3*s,hy-5*s,6*s,5*s));ctx.fillStyle="#345";ctx.fillRect(hx-7*s,hy+6*s,14*s,4*s)}
  else [-1,1].forEach(m=>{
    const ex=k===7?hx+m*8*s:ex0+m*5*s,ey=k===7?hy-12*s:hy-2*s;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,3.6*s,0,7);ctx.fill();
    if(f.ko>0){ctx.strokeStyle="#111";ctx.lineWidth=1.5*s;line(ex-2*s,ey-2*s,ex+2*s,ey+2*s);line(ex-2*s,ey+2*s,ex+2*s,ey-2*s)}
    else{ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex+d*1.2*s,ey,1.8*s,0,7);ctx.fill()}
  });
  const nx=hx+d*5*s,ny=hy+4*s;
  ctx.fillStyle="#222";
  if(k===1||k===4||k===5||k===8){ctx.beginPath();ctx.ellipse(nx,ny,3*s,2*s,0,0,7);ctx.fill()}
  if(k===2||k===3){ctx.fillStyle="#ff7a9c";ctx.beginPath();ctx.arc(nx,ny,2*s,0,7);ctx.fill()}
  if(k===2){ctx.strokeStyle="#444";ctx.lineWidth=s;[-1,1].forEach(m=>{line(ex0+m*5*s,ny,ex0+m*14*s,ny-2*s);line(ex0+m*5*s,ny+2*s,ex0+m*14*s,ny+4*s)})}
  if(k===3){ctx.fillStyle="#fff";ctx.fillRect(nx-2*s,ny+3*s,4*s,4*s)}
  if(k===9){ctx.fillStyle="#ff9800";ctx.beginPath();ctx.moveTo(hx+d*5*s,hy+2*s);ctx.lineTo(hx+d*15*s,hy+5*s);ctx.lineTo(hx+d*5*s,hy+8*s);ctx.fill()}
  if(k===0){ctx.fillStyle="#2e7d32";ctx.beginPath();ctx.arc(hx+d*15*s,hy+2*s,1.2*s,0,7);ctx.fill();ctx.fillStyle="#fff";for(let i=0;i<3;i++)ctx.fillRect(hx+d*(8+i*3.5)*s-s,hy+8*s,2*s,3*s)}
  if(k!==9&&k!==0&&k!==6){ctx.strokeStyle="#222";ctx.lineWidth=1.5*s;ctx.beginPath();if(f.atk>0)ctx.ellipse(nx,ny+5*s,2.5*s,3*s,0,0,7);else ctx.arc(nx,ny+3*s,3*s,.2,Math.PI-.2);ctx.stroke()}
  if(f.rage>0){ctx.strokeStyle="#c00";ctx.lineWidth=2*s;[-1,1].forEach(m=>line(ex0+m*8*s,hy-9*s,ex0+m*2*s,hy-6*s))}
  const ext=f.atk>0?Math.sin((1-f.atk/.22)*Math.PI)*26*s:0,gx=X+d*(14*s+ext),gy=Z-30*s-ext*.1;
  ctx.strokeStyle=lim;ctx.lineWidth=5*s;line(X+d*6*s,Z-30*s,gx,gy);glove(f,gx,gy,s*(1+ext/60));

function crowd(t){

function lights(t){
  ctx.save();ctx.globalCompositeOperation="lighter";

function mat(){

  for(let i=0;i<8;i++){const a=i/8,b=(i+1)/8;ctx.fillStyle=i%2?"#3b2f80":"#46389a";ctx.beginPath();ctx.moveTo(xl(a),Y(a));ctx.lineTo(xr(a),Y(a));ctx.lineTo(xr(b),Y(b));ctx.lineTo(xl(b),Y(b));ctx.fill()}
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W/2,Y(.5),W*.22,H*.07,0,0,7);ctx.stroke();
  ctx.font="bold "+Math.round(W*.1)+"px serif";ctx.globalAlpha=.25;ctx.fillText("🥊",W/2,Y(.5));ctx.globalAlpha=1;
  ctx.strokeStyle="#ffd23f";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xl(0),Y(0));ctx.lineTo(xl(1),Y(1));ctx.moveTo(xr(0),Y(0));ctx.lineTo(xr(1),Y(1));ctx.stroke();

function draw(){
  const t=performance.now()/1000,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a0b3d");g.addColorStop(1,"#07050f");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

/* ligação com a live real: serviço Euler Stream (terceiros), por @usuario ou link */
let ws,want=false,nEv=0,lastT="?";
const st=t=>$("#st").textContent=t;
const parseId=s=>{s=String(s).trim();const m=s.match(/@([A-Za-z0-9._]+)/);return (m?m[1]:s).replace(/[^A-Za-z0-9._]/g,"")};
const streak={};
function gift(n,g,d,c){
  const k=n+"|"+g,prev=streak[k]||0,add=c>prev?c-prev:c;
  streak[k]=c;setTimeout(()=>{if(streak[k]===c)delete streak[k]},4000);
  onGift(n,g,d,add);
}
function handle(m){
  nEv++;lastT=String(m.type||m.event||m.method||"?");
  const t=String(m.type||m.event||m.method||"").toLowerCase(),d=m.data||m,u=d.user||m.user||{},
    n=u.nickname||u.uniqueId||d.nickname||d.uniqueId||"Viewer";
  if(t.includes("gift")){const g=d.gift||d;gift(n,g.name||g.giftName||"",g.diamondCount||g.diamond_count||1,d.repeatCount||g.repeatCount||1)}
  else if(t.includes("chat")||t==="comment")onComment(n,d.comment||d.content||"");
}
const WHY={4400:"opções inválidas",4401:"chave ausente ou inválida (gere a chave grátis no Euler Stream)",4403:"sem permissão com essa chave",4404:"esse @ não está ao vivo agora",4429:"conexões demais com essa chave",4005:"a live terminou",4006:"sem mensagens por muito tempo",4500:"o TikTok fechou a conexão",4555:"tempo máximo da conexão atingido",4556:"erro ao buscar a live",4557:"erro ao buscar dados da live"};
function connect(){
  const id=parseId($("#live").value),key=$("#key").value.trim();
  if(!id){st("Digite o @ ou o link da live");return}
  try{localStorage.setItem("rl_live",$("#live").value);localStorage.setItem("rl_key",key)}catch(_){}
  want=true;if(ws){ws.onclose=null;ws.close()}
  st("Conectando a @"+id+"...");
  try{ws=new WebSocket("wss://ws.eulerstream.com?uniqueId="+encodeURIComponent(id)+(key?"&apiKey="+encodeURIComponent(key):""))}
  catch(_){st("Bloqueado aqui (abra o arquivo local)");return}
  ws.onopen=()=>st("Conectado a @"+id+" - aguardando eventos");
  ws.onclose=e=>{
    const why=WHY[e.code];
    if(why){want=false;st("Desconectado: "+why+" (código "+e.code+")");return}
    if(want){st("Falha na conexão (código "+e.code+"). Falta a chave ou o @ está fora do ar? Tentando de novo...");setTimeout(()=>{if(want)connect()},5000)}
  };
  ws.onmessage=e=>{
    if(typeof e.data!=="string"){st("Recebendo dados binários, formato que este jogo ainda não lê");return}
    let d;try{d=JSON.parse(e.data)}catch(_){return}
    (d.messages||[d]).forEach(handle);
    st("@"+id+" - "+nEv+" eventos (último: "+lastT+")");
  };
}
$("#snd").onclick=()=>{mute=!mute;$("#snd").textContent=mute?"🔇 Som":"🔊 Som"};
$("#go").onclick=connect;$("#live").onkeydown=e=>{if(e.key==="Enter")connect()};
try{$("#live").value=localStorage.getItem("rl_live")||"";$("#key").value=localStorage.getItem("rl_key")||""}catch(_){}
